openapi: "3.0.3"
info:
  title: Order API
  version: "1.0"
paths:
  /api/orders:
    post:
      summary: Create order
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: string }
        quantity: { type: integer, minimum: 1 }
    OrderResponse:
      type: object
      required: [order_no, payable_amount]
      properties:
        order_no: { type: string }
        payable_amount: { type: number, format: float }
    ErrorBody:
      type: object
      properties:
        error_message: { type: string }
